<!doctype html>
<!-- Build template (scripts/build.mts): one page per published product at /product/<slug>/. Not served directly. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="product">
  <meta name="theme-color" content="#e50069">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body data-page="product" data-product="{{SLUG}}">
  <header id="site-header"></header>
  <main id="main">
    <div id="view">{{VIEW}}</div>
  </main>
  <footer id="site-footer"></footer>
  <script src="/assets/js/site-config.js"></script>
  <script src="/assets/js/catalog.js"></script>
  <script src="/assets/js/lib.js"></script>
  <script src="/assets/js/render.js"></script>
  <script src="/assets/js/main.js"></script>
</body>
</html>
